name: Build Windows installer

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build application and installer
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\build_windows.ps1

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "installer\Output\GeneralXanaxa-Setup.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not created: $installer"
          }
          Get-Item $installer | Format-List Name, Length, LastWriteTime

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: General-Xanaxa-Windows-Installer
          path: installer/Output/GeneralXanaxa-Setup.exe
          if-no-files-found: error
          retention-days: 30
